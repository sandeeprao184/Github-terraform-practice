
name: Terraform Destroy All Managed Infrastructure

on:
  workflow_dispatch:
    inputs:
      confirm_destroy:
        description: "Type DESTROY to confirm AWS infrastructure deletion"
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  terraform-destroy:
    name: Destroy Terraform Infrastructure
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: .

    steps:
      - name: Validate Confirmation
        env:
          CONFIRM_DESTROY: ${{ inputs.confirm_destroy }}
        shell: bash
        run: |
          if [[ "$CONFIRM_DESTROY" != "DESTROY" ]]; then
            echo "::error::Confirmation failed. Type DESTROY exactly."
            exit 1
          fi

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::699158992697:role/oidc-role
          aws-region: us-east-1

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: Initialize Terraform
        run: terraform init -input=false

      - name: Validate Terraform Configuration
        run: terraform validate

      - name: Check Terraform State
        shell: bash
        run: |
          set -euo pipefail

          terraform state list > /tmp/terraform-resources.txt

          if [[ ! -s /tmp/terraform-resources.txt ]]; then
            echo "::error::No managed resources found in this Terraform state."
            echo "Check that Terraform is using the same backend, workspace,"
            echo "and state file used by your deployment workflow."
            exit 1
          fi

          echo "Resources tracked in Terraform state:"
          cat /tmp/terraform-resources.txt

      - name: Preview Infrastructure Deletion
        env:
          TF_VAR_aws_public_key: ${{ secrets.AWS_PUBLIC_KEY }}
          TF_VAR_ssh_allowed_cidr: ${{ secrets.SSH_ALLOWED_CIDR }}
        run: terraform plan -destroy -input=false

      - name: Destroy Infrastructure
        env:
          TF_VAR_aws_public_key: ${{ secrets.AWS_PUBLIC_KEY }}
          TF_VAR_ssh_allowed_cidr: ${{ secrets.SSH_ALLOWED_CIDR }}
        run: terraform destroy -auto-approve -input=false

      - name: Verify Terraform State
        if: success()
        run: terraform state list

name: Terraform Destroy

on:
  workflow_dispatch:
  # Uncomment to deploy automatically when changes are pushed to main
  # push:
  #   branches:
  #     - main

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    name: Terraform Destroy
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::699158992697:role/oidc-role
          aws-region: us-east-1

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        env:
          TF_VAR_aws_public_key: ${{ secrets.AWS_PUBLIC_KEY }}
          TF_VAR_ssh_allowed_cidr: ${{ secrets.SSH_ALLOWED_CIDR }}
        run: terraform plan -out=tfplan

      - name: Terraform destroy
        env:
          TF_VAR_aws_public_key: ${{ secrets.AWS_PUBLIC_KEY }}
          TF_VAR_ssh_allowed_cidr: ${{ secrets.SSH_ALLOWED_CIDR }}
        run: terraform destroy -auto-approve tfplan
